workflows:
  planos-castillo-android:
    name: PLANOS CASTILLO - Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generar carpetas nativas faltantes (android/ios)
        script: flutter create --org com.castillo --project-name planos_castillo .
      - name: Instalar dependencias
        script: flutter pub get
      - name: Analizar código
        script: flutter analyze || true
      - name: Compilar APK (release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
